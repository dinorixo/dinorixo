<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Search Anime — DIXORINO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07070b;
color:#fff;
font-family:Arial,sans-serif;
}

header{
height:70px;
display:flex;
align-items:center;
gap:18px;
padding:0 22px;
background:rgba(10,10,16,.9);
border-bottom:1px solid rgba(255,255,255,.08);
position:sticky;
top:0;
z-index:10;
backdrop-filter:blur(15px);
}

.logo{
font-size:25px;
font-weight:900;
background:linear-gradient(90deg,#ff3f91,#9b5cff);
-webkit-background-clip:text;
color:transparent;
}

.search{
flex:1;
max-width:600px;
padding:13px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:#15151f;
color:#fff;
outline:none;
font-size:15px;
}

main{
max-width:1250px;
margin:auto;
padding:30px 20px;
}

h1{
font-size:32px;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:15px;
}

.card{
background:#14141d;
border:1px solid rgba(255,255,255,.07);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.25s;
position:relative;
}

.card:hover{
transform:translateY(-6px);
border-color:#ff3f91;
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.card h3{
font-size:14px;
margin:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.card p{
font-size:12px;
color:#999;
margin:0 10px 12px;
}

.loading{
color:#999;
padding:20px 0;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin:35px 0;
}

.pagination button{
background:#15151f;
color:#fff;
border:1px solid rgba(255,255,255,.12);
padding:11px 18px;
border-radius:10px;
cursor:pointer;
}

.pagination button:hover:not(:disabled){
border-color:#ff3f91;
}

.pagination button:disabled{
opacity:.4;
cursor:not-allowed;
}

#pageInfo{
color:#aaa;
font-size:14px;
}

.pagination{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
margin:35px 0;
flex-wrap:wrap;
}

.pagination button{
background:#15151f;
color:#fff;
border:1px solid rgba(255,255,255,.1);
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.pagination button:hover{
border-color:#ff3f91;
}

.pagination button.active{
background:#ff3f91;
border-color:#ff3f91;
}

.pagination button:disabled{
opacity:.4;
cursor:not-allowed;
}

@media(max-width:1000px){
.grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:650px){
.grid{grid-template-columns:repeat(3,1fr)}
.poster{height:210px}
}

@media(max-width:450px){
.grid{grid-template-columns:repeat(2,1fr)}
.poster{height:240px}
header{padding:0 12px}
.logo{font-size:21px}
}
</style>
</head>

<body>

<header>

<div class="logo">DIXORINO</div>

<input
id="search"
class="search"
placeholder="Search anime..."
autocomplete="off">

</header>

<main>

<h1 id="title">Search Results</h1>

<div id="results" class="grid">
<div class="loading">Searching...</div>
</div>

<div id="pagination" class="pagination"></div>

</main>

<script>

const API="https://graphql.anilist.co";

const params=new URLSearchParams(location.search);

let query=params.get("q")||"";
let page=parseInt(params.get("page")||"1",10);

if(page<1) page=1;

const perPage=24;

const searchInput=document.getElementById("search");
const results=document.getElementById("results");
const title=document.getElementById("title");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const pageInfo=document.getElementById("pageInfo");

searchInput.value=query;

function escapeHTML(text){
return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

let favorites=
JSON.parse(
  localStorage.getItem("dixorinoFavorites")||"[]"
).map(Number);

function toggleFavorite(event,id){

event.stopPropagation();

id=Number(id);

if(favorites.includes(id)){
  favorites=favorites.filter(x=>x!==id);
}else{
  favorites.push(id);
}

localStorage.setItem(
  "dixorinoFavorites",
  JSON.stringify(favorites)
);

const heart=event.currentTarget;

const isFav=favorites.includes(id);

heart.classList.toggle("on",isFav);
heart.textContent=isFav?"♥":"♡";

}

function createCard(a){

const title=
a.title?.english||
a.title?.romaji||
a.title?.native||
"Unknown";

const image=
a.coverImage?.large||
a.coverImage?.medium||
"";

const id=Number(a.id);
const fav=favorites.includes(id);

return `
<div
class="card"
onclick="location.href='details.html?anilist=${id}'">

<button
class="heart ${fav?"on":""}"
onclick="toggleFavorite(event,${id})">
${fav?"♥":"♡"}
</button>

<img
class="poster"
src="${image}"
alt="${escapeHTML(title)}"
loading="lazy">

<h3>${escapeHTML(title)}</h3>

<p>
⭐ ${
a.averageScore
? (a.averageScore/10).toFixed(1)
: "N/A"
}
 · ${a.episodes||"?"} eps
</p>

</div>
`;
}

async function search(){

if(!query){

title.textContent="Search Anime";

results.innerHTML=
"<div class='loading'>Type an anime name to search.</div>";

document.getElementById("pagination").innerHTML="";

return;

}

title.textContent=
'Search results for "'+query+'"';

results.innerHTML=
"<div class='loading'>Searching page "+page+"...</div>";

try{

const graphql=`

query($search:String,$page:Int){

Page(page:$page,perPage:24){

pageInfo{
currentPage
lastPage
hasNextPage
}

media(
search:$search,
type:ANIME,
sort:SEARCH_MATCH
){

id
idMal

title{
english
romaji
native
}

coverImage{
large
medium
}

averageScore
episodes

}

}

}

`;

const response=await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
query:graphql,
variables:{
search:query,
page:page
}
})
});

if(!response.ok){
throw new Error("AniList HTTP "+response.status);
}

const json=await response.json();

if(json.errors){
throw new Error(
json.errors[0]?.message||"AniList error"
);
}

const pageData=json.data?.Page;

const anime=pageData?.media||[];

if(!anime.length){

results.innerHTML=
"<div class='loading'>No anime found.</div>";

document.getElementById("pagination").innerHTML="";

return;

}

results.innerHTML=
anime.map(createCard).join("");

const pagination=
document.getElementById("pagination");

const lastPage=
pageData?.pageInfo?.lastPage||page;

let html="";

if(page>1){

html+=`
<button onclick="goToPage(${page-1})">
← Previous
</button>
`;

}

const startPage=Math.max(1,page-2);
const endPage=Math.min(lastPage,page+2);

for(let i=startPage;i<=endPage;i++){

html+=`
<button
class="${i===page?"active":""}"
onclick="goToPage(${i})">
${i}
</button>
`;

}

if(pageData?.pageInfo?.hasNextPage){

html+=`
<button onclick="goToPage(${page+1})">
Next →
</button>
`;

}

pagination.innerHTML=html;

window.scrollTo({
top:0,
behavior:"smooth"
});

}catch(error){

console.error("SEARCH ERROR:",error);

results.innerHTML=
"<div class='loading'>Search is temporarily unavailable.</div>";

document.getElementById("pagination").innerHTML="";

}

}

function goToPage(newPage){

if(newPage<1)return;

page=newPage;

const url=
"search.html?q="+
encodeURIComponent(query)+
"&page="+page;

history.pushState({}, "", url);

search();

}



function goToPage(newPage){

if(newPage<1)return;

location.href=
"search.html?q="+
encodeURIComponent(query)+
"&page="+
newPage;

}

searchInput.addEventListener("keydown",function(e){

if(e.key==="Enter"){

const q=this.value.trim();

if(q){

location.href=
"search.html?q="+
encodeURIComponent(q)+
"&page=1";

}

}

});

search();

</script>

</body>
</html>
