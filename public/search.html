<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Search Anime — DIXORINO</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#07070b;
color:#fff;
font-family:Arial,sans-serif;
}

header{
height:70px;
display:flex;
align-items:center;
gap:18px;
padding:0 22px;
background:rgba(10,10,16,.9);
border-bottom:1px solid rgba(255,255,255,.08);
position:sticky;
top:0;
z-index:10;
backdrop-filter:blur(15px);
}

.logo{
font-size:25px;
font-weight:900;
background:linear-gradient(90deg,#ff3f91,#9b5cff);
-webkit-background-clip:text;
color:transparent;
}

.search{
flex:1;
max-width:600px;
padding:13px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:#15151f;
color:#fff;
outline:none;
font-size:15px;
}

main{
max-width:1250px;
margin:auto;
padding:30px 20px;
}

h1{
font-size:32px;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:15px;
}

.card{
background:#14141d;
border:1px solid rgba(255,255,255,.07);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-6px);
border-color:#ff3f91;
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
}

.card h3{
font-size:14px;
margin:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.card p{
font-size:12px;
color:#999;
margin:0 10px 12px;
}

.loading{
color:#999;
padding:20px 0;
}

@media(max-width:1000px){
.grid{
grid-template-columns:repeat(4,1fr);
}
}

@media(max-width:650px){
.grid{
grid-template-columns:repeat(3,1fr);
}

.poster{
height:210px;
}
}

@media(max-width:450px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.poster{
height:240px;
}

header{
padding:0 12px;
}

.logo{
font-size:21px;
}
}

</style>

</head>

<body>

<header>

<div class="logo">DIXORINO</div>

<input
id="search"
class="search"
placeholder="Search anime..."
autocomplete="off">

</header>

<main>

<h1 id="title">Search Results</h1>

<div id="results" class="grid">

<div class="loading">
Searching...
</div>

</div>

</main>

<script>

const API="https://graphql.anilist.co";

const params=
new URLSearchParams(location.search);

const query=
params.get("q")||"";

document.getElementById("search").value=query;

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function createCard(a){

const title=
a.title?.english||
a.title?.romaji||
a.title?.native||
"Unknown";

const image=
a.coverImage?.large||
a.coverImage?.medium||
"";

const id=a.id;

return `

<div
class="card"
onclick="location.href='details.html?anilist=${id}'">

<img
class="poster"
src="${image}"
alt="${escapeHTML(title)}"
loading="lazy">

<h3>
${escapeHTML(title)}
</h3>

<p>
⭐ ${
a.averageScore
? (a.averageScore/10).toFixed(1)
: "N/A"
}
 ·
 ${a.episodes||"?"} eps
</p>

</div>

`;

}

async function search(){

if(!query){

document.getElementById("title").textContent=
"Search Anime";

document.getElementById("results").innerHTML=
"<div class='loading'>Type an anime name to search.</div>";

return;

}

document.getElementById("title").textContent=
'Search results for "'+
query+
'"';

try{

const graphql=`

query($search:String){

Page(page:1,perPage:24){

media(
search:$search,
type:ANIME,
sort:SEARCH_MATCH
){

id
idMal

title{
english
romaji
native
}

coverImage{
large
medium
}

averageScore
episodes

}

}

}

`;

const response=await fetch(
API,
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
query:graphql,
variables:{
search:query
}
})
}
);

const json=await response.json();

if(json.errors){

throw new Error(
json.errors[0]?.message||
"AniList error"
);

}

const anime=
json.data?.Page?.media||[];

const results=
document.getElementById("results");

if(!anime.length){

results.innerHTML=
"<div class='loading'>No anime found.</div>";

return;

}

results.innerHTML=
anime.map(createCard).join("");

}catch(error){

console.error(error);

document.getElementById("results").innerHTML=
"<div class='loading'>Search is temporarily unavailable.</div>";

}

}

document.getElementById("search")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){

const q=this.value.trim();

if(q){

location.href=
"search.html?q="+
encodeURIComponent(q);

}

}

});

search();

</script>

</body>
</html>
