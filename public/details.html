<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Anime</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;padding:0 20px;gap:25px}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
header a{color:#fff;text-decoration:none}
main{max-width:1150px;margin:auto;padding:20px}
.back{color:#ff3f91;text-decoration:none}
.hero{display:flex;gap:30px;margin-top:25px;padding:25px;background:#12151d;border-radius:16px}
.poster{width:240px;height:350px;object-fit:cover;border-radius:10px}
.content{flex:1}
h1{font-size:34px;margin:0 0 12px}
.description{color:#bbb;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.tag{background:#20232d;padding:7px 11px;border-radius:20px;font-size:13px}
.info{color:#aaa;line-height:1.8}
.favorite{margin-top:18px;background:#ff3f91;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold}
.trailer{margin-top:30px}
.trailer iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.episodes{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}
.ep{background:#191c26;color:white;border:0;padding:13px;border-radius:7px}
.ep:hover{background:#ff3f91}
.loading{color:#888}
@media(max-width:700px){
.hero{flex-direction:column}
.poster{width:190px;height:280px}
h1{font-size:27px}
.episodes{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<header>
<div class="logo">DIXORINO</div>
<a href="/">Home</a>
</header>

<main>

<a class="back" href="/">← Home</a>

<div id="status" class="loading">Loading...</div>
<div id="anime"></div>

</main>

<script>

const params=new URLSearchParams(location.search);

const id=params.get("id");
const anilistId=params.get("anilist");

const API="https://api.jikan.moe/v4";
const ANILIST="https://graphql.anilist.co";

let animeData=null;

async function loadAnime(){

if(!id && !anilistId){
document.getElementById("status").textContent="Anime not selected.";
return;
}

try{

if(anilistId){

const query=`
query ($id: Int) {
  Media(id: $id, type: ANIME) {
    id
    idMal
    title {
      romaji
      english
      native
    }
    description
    averageScore
    episodes
    status
    type
    season
    seasonYear
    genres
    studios {
      nodes {
        name
      }
    }
    coverImage {
      large
      medium
    }
  }
}`;

const r=await fetch(ANILIST,{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
  },
  body:JSON.stringify({
    query:query,
    variables:{id:Number(anilistId)}
  })
});

const x=await r.json();

if(x.errors || !x.data?.Media){
  throw new Error("AniList details unavailable");
}

const a=x.data.Media;

animeData={
  mal_id:a.idMal,
  title:a.title?.english||a.title?.romaji||a.title?.native||"Unknown",
  synopsis:a.description||"No description available.",
  score:a.averageScore ? a.averageScore/10 : null,
  episodes:a.episodes,
  status:a.status,
  type:a.type,
  season:a.season,
  year:a.seasonYear,
  genres:(a.genres||[]).map(name=>({name:name})),
  studios:(a.studios?.nodes||[]).map(studio=>({name:studio.name})),
  images:{
    jpg:{
      large_image_url:a.coverImage?.large||a.coverImage?.medium||""
    }
  }
};

}else{

const r=await fetch(API+"/anime/"+id);
const x=await r.json();

animeData=x.data;

}

const a=animeData;

document.title="DIXORINO - "+a.title;

const genres=(a.genres||[])
.map(g=>`<span class="tag">${safe(g.name)}</span>`)
.join("");

const studios=(a.studios||[])
.map(s=>safe(s.name))
.join(", ")||"Unknown";

document.getElementById("status").style.display="none";

document.getElementById("anime").innerHTML=`

<div class="hero">

<img class="poster"
src="${a.images?.jpg?.large_image_url||""}"
alt="${safe(a.title)}">

<div class="content">

<h1>${safe(a.title)}</h1>

<div class="tags">${genres}</div>

<p class="description">
${safe(a.synopsis||"No description available.")}
</p>

<div class="info">
⭐ Score: ${a.score||"N/A"}<br>
🏆 Rank: ${a.rank ? "#"+a.rank : "N/A"}<br>
📺 Episodes: ${a.episodes||"Unknown"}<br>
🎬 Type: ${safe(a.type||"Unknown")}<br>
🏢 Studio: ${studios}<br>
📅 Status: ${safe(a.status||"Unknown")}<br>
⭐ Rating: ${safe(a.rating||"Not rated")}
</div>

<button class="favorite" id="fav">
♡ Add to Favorites
</button>

</div>
</div>

<div class="trailer" id="trailer"></div>

<h2>Episodes</h2>

<div class="episodes" id="episodes">
<div class="loading">Loading episodes...</div>
</div>
`;

setupFavorite();
loadTrailer();
loadEpisodes();

}catch(e){

console.error(e);
document.getElementById("status").textContent=
"Could not load this anime.";

}

}

async function loadTrailer(){

  // Trailer loading is optional.
  // Don't let a missing trailer break the details page.

  try{

    if(!animeData?.mal_id){
      return;
    }

    const r=await fetch(
      API+"/anime/"+animeData.mal_id+"/videos"
    );

    if(!r.ok)return;

    const x=await r.json();

    const promo=
      x.data?.promo?.[0] ||
      x.data?.promos?.[0];

    if(promo?.trailer?.embed_url){

      document.getElementById("trailer").innerHTML=`

        <h2>🎬 Trailer</h2>

        <iframe
          src="${promo.trailer.embed_url}"
          allowfullscreen>
        </iframe>

      `;

    }

  }catch(e){

    console.log("No trailer available");

  }

}


async function loadEpisodes(){

  const box=document.getElementById("episodes");

  // AniList doesn't provide streaming episode lists.
  // If we have a MAL ID, try Jikan.
  if(!animeData?.mal_id){

    box.innerHTML=
      "<div class='loading'>Episode information unavailable for this anime.</div>";

    return;

  }

  try{

    const r=await fetch(
      API+"/anime/"+animeData.mal_id+"/episodes"
    );

    if(!r.ok){
      throw new Error("Episode API failed");
    }

    const x=await r.json();

    const episodes=x.data||[];

    if(!episodes.length){

      box.innerHTML=
        "<div class='loading'>No episode information available.</div>";

      return;

    }

    box.innerHTML=episodes.map(ep=>`

      <button class="ep"
        onclick="openEpisode(${ep.mal_id})">
        Episode ${ep.mal_id}
      </button>

    `).join("");

  }catch(e){

    console.log("Episodes unavailable",e);

    box.innerHTML=
      "<div class='loading'>Episode information unavailable.</div>";

  }

}


function openEpisode(number){

  location.href=
    "watch.html?anime="+
    encodeURIComponent(animeData.title)+
    "&episode="+number+
    "&id="+(animeData.mal_id||id)+
    "&total="+(animeData.episodes||12);

}

function setupFavorite(){

const button=document.getElementById("fav");

let favorites=
JSON.parse(
localStorage.getItem("dixorinoFavorites")||"[]"
);

function update(){

const saved=favorites.includes(Number(id));

button.textContent=
saved
?"♥ Remove from Favorites"
:"♡ Add to Favorites";

}

button.onclick=()=>{

const num=Number(id);

if(favorites.includes(num)){

favorites=
favorites.filter(x=>x!==num);

}else{

favorites.push(num);

}

localStorage.setItem(
"dixorinoFavorites",
JSON.stringify(favorites)
);

update();

};

update();

}

function safe(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

loadAnime();

</script>

</body>
</html>
