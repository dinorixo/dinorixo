<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Anime</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;padding:0 20px;gap:25px}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
header a{color:#fff;text-decoration:none}
main{max-width:1150px;margin:auto;padding:20px}
.back{color:#ff3f91;text-decoration:none}
.hero{display:flex;gap:30px;margin-top:25px;padding:25px;background:#12151d;border-radius:16px}
.poster{width:240px;height:350px;object-fit:cover;border-radius:10px}
.content{flex:1}
h1{font-size:34px;margin:0 0 12px}
.description{color:#bbb;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.tag{background:#20232d;padding:7px 11px;border-radius:20px;font-size:13px}
.info{color:#aaa;line-height:1.8}
.favorite{margin-top:18px;background:#ff3f91;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold}
.trailer{margin-top:30px}
.trailer iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.episodes{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}
.ep{background:#191c26;color:white;border:0;padding:13px;border-radius:7px}
.ep:hover{background:#ff3f91}
.loading{color:#888}
@media(max-width:700px){
.hero{flex-direction:column}
.poster{width:190px;height:280px}
h1{font-size:27px}
.episodes{grid-template-columns:repeat(3,1fr)}
}


/* ===== DIXORINO DETAILS UPGRADE ===== */

.details-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  color:#bbb;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}

.details-back:hover{
  color:#ff3f91;
  transform:translateX(-3px);
}

.hero{
  position:relative;
  isolation:isolate;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 10% 20%,rgba(255,63,145,.12),transparent 35%),
    radial-gradient(circle at 90% 80%,rgba(155,92,255,.10),transparent 35%);
  z-index:-1;
  pointer-events:none;
}

.details-poster-wrap{
  flex-shrink:0;
}

.details-poster-wrap .poster{
  display:block;
}

.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.favorite{
  cursor:pointer;
}

.watch-first{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#191c26;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
  padding:13px 22px;
  border-radius:11px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.watch-first:hover{
  background:linear-gradient(90deg,#ff3f91,#9b5cff);
}

.meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:16px 0;
}

.meta-pill{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  color:#ddd;
  padding:7px 11px;
  border-radius:999px;
  font-size:13px;
}

.section-title{
  margin-top:32px;
  margin-bottom:12px;
}

.episode-count{
  color:#888;
  font-size:14px;
  font-weight:normal;
}

@media(max-width:700px){

  .hero{
    padding:18px !important;
  }

  .details-poster-wrap{
    display:flex;
    justify-content:center;
  }

  .details-poster-wrap .poster{
    width:180px;
    height:265px;
  }

  .detail-actions{
    flex-direction:column;
  }

  .detail-actions button,
  .detail-actions a{
    width:100%;
    text-align:center;
  }

}


/* ================================
   DIXORINO 2.0 — MODERN UI
   ================================ */

:root{
  --bg:#07070b;
  --panel:#101018;
  --panel2:#151520;
  --accent:#ff3f91;
  --accent2:#9b5cff;
  --text:#f7f7fb;
  --muted:#9292a3;
  --border:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
}

body{
  background:
    radial-gradient(circle at 15% 0%,rgba(255,63,145,.10),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(155,92,255,.10),transparent 28%),
    var(--bg) !important;
  color:var(--text) !important;
}

/* HEADER */

header{
  height:72px !important;
  background:rgba(10,10,16,.82) !important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:0 28px !important;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px !important;
  font-weight:950 !important;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#ff3f91,#b56cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent !important;
}

header a{
  color:#d8d8e2 !important;
  font-weight:600;
  transition:.2s;
}

header a:hover{
  color:#fff !important;
}

/* MAIN */

main{
  max-width:1250px !important;
  padding:30px 22px !important;
}

/* SEARCH */

input[type="search"],
input[type="text"]{
  background:rgba(255,255,255,.055) !important;
  border:1px solid var(--border) !important;
  color:#fff !important;
  border-radius:14px !important;
  padding:14px 18px !important;
  outline:none;
  transition:.25s;
}

input[type="search"]:focus,
input[type="text"]:focus{
  border-color:rgba(255,63,145,.6) !important;
  box-shadow:0 0 0 4px rgba(255,63,145,.08);
}

/* CARDS */

.card{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.075),
    rgba(255,255,255,.025)
  ) !important;
  border:1px solid var(--border);
  border-radius:16px !important;
  overflow:hidden;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
  position:relative;
}

.card:hover{
  transform:translateY(-7px);
  border-color:rgba(255,63,145,.35);
  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    0 0 30px rgba(255,63,145,.08);
}

.card img{
  transition:transform .4s ease;
}

.card:hover img{
  transform:scale(1.045);
}

/* BUTTONS */

button,
.control,
.load-more{
  border:1px solid rgba(255,255,255,.08) !important;
  border-radius:11px !important;
  transition:.2s ease !important;
}

button:hover,
.control:hover,
.load-more:hover{
  background:linear-gradient(90deg,var(--accent),var(--accent2)) !important;
  color:#fff !important;
  transform:translateY(-1px);
}

/* TAGS */

.tag{
  background:rgba(255,63,145,.10) !important;
  border:1px solid rgba(255,63,145,.18);
  color:#ff8cba !important;
  border-radius:999px !important;
  padding:5px 10px !important;
}

/* DETAILS HERO */

.hero{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    ) !important;
  border:1px solid var(--border);
  border-radius:24px !important;
  padding:25px !important;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.poster{
  border-radius:17px !important;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.content h1{
  font-size:clamp(30px,5vw,54px) !important;
  letter-spacing:-1.5px;
}

.description{
  color:#b6b6c3 !important;
  line-height:1.75 !important;
}

/* INFO */

.info{
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px 17px;
  line-height:1.9;
  color:#d4d4df;
}

/* FAVORITE */

.favorite{
  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  ) !important;
  color:#fff !important;
  font-weight:700;
  border:0 !important;
  padding:13px 22px !important;
}

/* TRAILER */

.trailer{
  margin-top:25px;
  border-radius:18px;
  overflow:hidden;
}

/* EPISODES */

.episodes{
  gap:10px !important;
}

.ep{
  background:#14141e !important;
  border:1px solid var(--border) !important;
  color:#ddd !important;
}

.ep.active,
.ep:hover{
  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  ) !important;
}

/* WATCH PLAYER */

.player-wrap{
  border:1px solid var(--border);
  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 50px rgba(255,63,145,.05);
}

video{
  border-radius:14px;
}

.player-status{
  background:rgba(5,5,10,.82) !important;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
}

/* WATCH NOTICE */

.notice{
  background:rgba(255,255,255,.035) !important;
  border:1px solid var(--border);
  color:#9292a3 !important;
}

/* LOADING */

.loading{
  color:#aaa !important;
}

/* MOBILE */

@media(max-width:700px){

  header{
    height:62px !important;
    padding:0 15px !important;
  }

  main{
    padding:20px 14px !important;
  }

  .hero{
    padding:15px !important;
    border-radius:18px !important;
  }

  .poster{
    border-radius:13px !important;
  }

  .card{
    border-radius:13px !important;
  }

}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:#07070b;
}

::-webkit-scrollbar-thumb{
  background:#292936;
  border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
  background:#ff3f91;
}

</style>
</head>

<body>

<header>
<div class="logo">DIXORINO</div>
<a href="/">Home</a>
</header>

<main>

<a class="back" href="/">← Home</a>

<div id="status" class="loading">Loading...</div>
<div id="anime"></div>

</main>

<script>

const params=new URLSearchParams(location.search);

const id=params.get("id");
const anilistId=params.get("anilist");

const API="https://api.jikan.moe/v4";
const ANILIST="https://graphql.anilist.co";

let animeData=null;

async function loadAnime(){

if(!id && !anilistId){
document.getElementById("status").textContent="Anime not selected.";
return;
}

try{

if(anilistId){

const query=`
query ($id: Int) {
  Media(id: $id, type: ANIME) {
    id
    idMal
    title {
      romaji
      english
      native
    }
    description
    averageScore
    episodes
    status
    type
    season
    seasonYear
    genres
    studios {
      nodes {
        name
      }
    }
    coverImage {
      large
      medium
    }
  }
}`;

const r=await fetch(ANILIST,{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
  },
  body:JSON.stringify({
    query:query,
    variables:{id:Number(anilistId)}
  })
});

const x=await r.json();

if(x.errors || !x.data?.Media){
  throw new Error("AniList details unavailable");
}

const a=x.data.Media;

animeData={
  mal_id:a.idMal,
  title:a.title?.english||a.title?.romaji||a.title?.native||"Unknown",
  synopsis:a.description||"No description available.",
  score:a.averageScore ? a.averageScore/10 : null,
  episodes:a.episodes,
  status:a.status,
  type:a.type,
  season:a.season,
  year:a.seasonYear,
  genres:(a.genres||[]).map(name=>({name:name})),
  studios:(a.studios?.nodes||[]).map(studio=>({name:studio.name})),
  images:{
    jpg:{
      large_image_url:a.coverImage?.large||a.coverImage?.medium||""
    }
  }
};

}else{

const r=await fetch(API+"/anime/"+id);
const x=await r.json();

animeData=x.data;

}

const a=animeData;

document.title="DIXORINO - "+a.title;

const genres=(a.genres||[])
.map(g=>`<span class="tag">${safe(g.name)}</span>`)
.join("");

const studios=(a.studios||[])
.map(s=>safe(s.name))
.join(", ")||"Unknown";

document.getElementById("status").style.display="none";

document.getElementById("anime").innerHTML=`

<div class="hero">

<div class="details-poster-wrap">
<img class="poster"
src="${a.images?.jpg?.large_image_url||""}"
alt="${safe(a.title)}"
loading="eager">
</div>

<div class="content">

<h1>${safe(a.title)}</h1>

<div class="tags">${genres}</div>

<p class="description">
${safe(a.synopsis||"No description available.")}
</p>

<div class="info">
⭐ Score: ${a.score||"N/A"}<br>
🏆 Rank: ${a.rank ? "#"+a.rank : "N/A"}<br>
📺 Episodes: ${a.episodes||"Unknown"}<br>
🎬 Type: ${safe(a.type||"Unknown")}<br>
🏢 Studio: ${studios}<br>
📅 Status: ${safe(a.status||"Unknown")}<br>
⭐ Rating: ${safe(a.rating||"Not rated")}
</div>

<div class="detail-actions">

<button class="favorite" id="fav">
♡ Add to Favorites
</button>

<button class="watch-first" id="watchFirst">
▶ Start Watching
</button>

</div>

</div>
</div>

<div class="trailer" id="trailer"></div>

<h2>Episodes</h2>

<div class="episodes" id="episodes">
<div class="loading">Loading episodes...</div>
</div>
`;

setupFavorite();
setupWatchButton();
loadTrailer();
loadEpisodes();

}catch(e){

console.error(e);
document.getElementById("status").textContent=
"Could not load this anime.";

}

}

async function loadTrailer(){

  // Trailer loading is optional.
  // Don't let a missing trailer break the details page.

  try{

    if(!animeData?.mal_id){
      return;
    }

    const r=await fetch(
      API+"/anime/"+animeData.mal_id+"/videos"
    );

    if(!r.ok)return;

    const x=await r.json();

    const promo=
      x.data?.promo?.[0] ||
      x.data?.promos?.[0];

    if(promo?.trailer?.embed_url){

      document.getElementById("trailer").innerHTML=`

        <h2>🎬 Trailer</h2>

        <iframe
          src="${promo.trailer.embed_url}"
          allowfullscreen>
        </iframe>

      `;

    }

  }catch(e){

    console.log("No trailer available");

  }

}


async function loadEpisodes(){

  const box=document.getElementById("episodes");

  const total=Number(animeData?.episodes)||0;

  if(!total){
    box.innerHTML=
      "<div class='loading'>No episode information available.</div>";
    return;
  }

  let episodes=[];

  /*
   * If we have a MAL ID, get the real episode list.
   * Otherwise use AniList's episode count.
   */

  if(animeData?.mal_id){

    try{

      const r=await fetch(
        API+"/anime/"+animeData.mal_id+"/episodes"
      );

      if(r.ok){

        const x=await r.json();
        episodes=x.data||[];

      }

    }catch(e){

      console.log("Jikan episode list unavailable");

    }

  }

  /*
   * Fallback for anime without MAL episode data.
   */

  if(!episodes.length){

    episodes=Array.from(
      {length:total},
      (_,i)=>({mal_id:i+1})
    );

  }

  box.innerHTML=episodes.map(ep=>`

    <button class="ep"
      onclick="openEpisode(${ep.mal_id})">
      Episode ${ep.mal_id}
    </button>

  `).join("");

}


function openEpisode(number){

  location.href=
    "watch.html?anime="+
    encodeURIComponent(animeData.title)+
    "&episode="+number+
    "&id="+(animeData.mal_id||id)+
    "&total="+(animeData.episodes||12);

}

function setupWatchButton(){

const button=document.getElementById("watchFirst");

if(!button || !animeData){
  return;
}

button.onclick=()=>{

openEpisode(1);

};

}

function setupFavorite(){

const button=document.getElementById("fav");

let favorites=
JSON.parse(
localStorage.getItem("dixorinoFavorites")||"[]"
);

function update(){

const saved=favorites.includes(Number(id));

button.textContent=
saved
?"♥ Remove from Favorites"
:"♡ Add to Favorites";

}

button.onclick=()=>{

const num=Number(id);

if(favorites.includes(num)){

favorites=
favorites.filter(x=>x!==num);

}else{

favorites.push(num);

}

localStorage.setItem(
"dixorinoFavorites",
JSON.stringify(favorites)
);

update();

};

update();

}

function safe(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

loadAnime();

</script>

</body>
</html>
