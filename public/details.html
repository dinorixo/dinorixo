<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;padding:0 20px}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
header a{color:#fff;text-decoration:none;margin-left:25px}
main{max-width:1100px;margin:auto;padding:20px}
.back{color:#ff3f91;text-decoration:none}
.hero{display:flex;gap:30px;margin-top:25px;background:#12151d;padding:25px;border-radius:16px}
.poster{width:230px;height:330px;object-fit:cover;border-radius:10px}
.content{flex:1}
h1{font-size:32px;margin-top:0}
.description{color:#bbb;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:#20232d;padding:7px 11px;border-radius:20px;font-size:13px}
.info{color:#aaa;line-height:1.8;margin-top:15px}
.episodes{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:15px}
.ep{background:#191c26;color:#fff;border:0;border-radius:7px;padding:13px}
.ep:hover{background:#ff3f91}
@media(max-width:650px){
.hero{flex-direction:column}
.poster{width:180px;height:260px}
.episodes{grid-template-columns:repeat(3,1fr)}
h1{font-size:25px}
}
</style>
</head>
<body>

<header>
<div class="logo">DIXORINO</div>
<a href="/">Home</a>
</header>

<main>
<a class="back" href="/">← Home</a>

<div id="status">Loading...</div>
<div id="anime"></div>
</main>

<script>

const id=new URLSearchParams(location.search).get("id");

async function load(){

if(!id){
document.getElementById("status").textContent="Anime not selected.";
return;
}

try{

const r=await fetch("https://api.jikan.moe/v4/anime/"+id);
const x=await r.json();
const a=x.data;

document.title="DIXORINO - "+a.title;

const genres=(a.genres||[])
.map(g=>`<span class="tag">${g.name}</span>`).join("");

const studios=(a.studios||[])
.map(s=>s.name).join(", ")||"Unknown";

document.getElementById("status").style.display="none";

document.getElementById("anime").innerHTML=`

<div class="hero">

<img class="poster"
src="${a.images?.jpg?.large_image_url||""}">

<div class="content">

<h1>${safe(a.title)}</h1>

<div class="tags">${genres}</div>

<p class="description">
${safe(a.synopsis||"No description available.")}
</p>

<div class="info">
⭐ Score: ${a.score||"N/A"}<br>
📺 Episodes: ${a.episodes||"Unknown"}<br>
🎬 Type: ${a.type||"Unknown"}<br>
🏢 Studio: ${safe(studios)}<br>
📅 Status: ${a.status||"Unknown"}
</div>

</div>
</div>

<h2>Episodes</h2>

<div class="episodes" id="episodes">
Loading episodes...
</div>
`;

loadEpisodes();

}catch(e){

document.getElementById("status").textContent=
"Could not load anime.";

}

}

async function loadEpisodes(){

const box=document.getElementById("episodes");

try{

const r=await fetch(
"https://api.jikan.moe/v4/anime/"+id+"/episodes"
);

const x=await r.json();

if(!x.data||!x.data.length){

box.innerHTML="<p>No episode information available.</p>";
return;
}

box.innerHTML=x.data.map(ep=>`

<button class="ep"
onclick="watch(${ep.mal_id},${ep.mal_id})">
Episode ${ep.mal_id}
</button>

`).join("");

}catch(e){

box.innerHTML=
"<p>Episode information unavailable.</p>";

}

}

function watch(number){

location.href=
"watch.html?anime="+
encodeURIComponent(document.title.replace("DIXORINO - ",""))+
"&episode="+number;

}

function safe(t){

return String(t)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

load();

</script>

</body>
</html>
