<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Anime</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#08090d;
color:white;
font-family:Arial,sans-serif
}
header{
height:70px;
background:#10121a;
display:flex;
align-items:center;
padding:0 20px
}
.logo{
font-size:27px;
font-weight:900;
color:#ff3f91
}
header a{
color:white;
text-decoration:none;
margin-left:25px
}
main{
max-width:1100px;
margin:auto;
padding:25px
}
.back{
color:#ff3f91;
text-decoration:none
}
.hero{
display:flex;
gap:30px;
margin-top:25px;
background:#12151d;
padding:25px;
border-radius:16px
}
.poster{
width:230px;
height:330px;
object-fit:cover;
border-radius:10px;
background:#1c1f28
}
.content{
flex:1
}
h1{
font-size:32px;
margin-top:0
}
.description{
color:#bbb;
line-height:1.6
}
.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:15px 0
}
.tag{
background:#20232d;
padding:7px 11px;
border-radius:20px;
font-size:13px
}
.watch{
display:inline-block;
background:#ff3f91;
color:white;
padding:13px 22px;
border-radius:8px;
text-decoration:none;
margin-top:10px;
font-weight:bold
}
.info{
color:#aaa;
line-height:1.7
}
.loading{
color:#aaa;
font-size:18px
}
.error{
color:#ff6b9f
}
@media(max-width:650px){
.hero{
flex-direction:column
}
.poster{
width:180px;
height:260px
}
h1{
font-size:25px
}
}
</style>
</head>

<body>

<header>
<div class="logo">DIXORINO</div>
<a href="/">Home</a>
</header>

<main>

<a class="back" href="/">← Back to Home</a>

<div id="status" class="loading">
Loading anime...
</div>

<div id="anime" style="display:none"></div>

</main>

<script>

const params=new URLSearchParams(location.search);
const id=params.get("id");

const status=document.getElementById("status");
const box=document.getElementById("anime");

if(!id){

status.textContent="No anime selected.";
}else{

loadAnime(id);

}

async function loadAnime(id){

try{

const response=await fetch(
"https://api.jikan.moe/v4/anime/"+id
);

const result=await response.json();
const a=result.data;

if(!a){
throw new Error("Anime not found");
}

document.title=
"DIXORINO - "+a.title;

const image=
a.images?.jpg?.large_image_url ||
a.images?.jpg?.image_url ||
"";

const genres=
(a.genres||[])
.map(g=>`<span class="tag">${g.name}</span>`)
.join("");

const studios=
(a.studios||[])
.map(s=>s.name)
.join(", ") || "Unknown";

const score=
a.score ?? "N/A";

const episodes=
a.episodes ?? "Unknown";

const synopsis=
a.synopsis ||
"No description available.";

box.innerHTML=`

<div class="hero">

<img
class="poster"
src="${image}"
alt="${escapeHtml(a.title)}"
>

<div class="content">

<h1>${escapeHtml(a.title)}</h1>

<div class="tags">
${genres}
</div>

<p class="description">
${escapeHtml(synopsis)}
</p>

<div class="info">

<b>⭐ Score:</b> ${score}<br>
<b>📺 Episodes:</b> ${episodes}<br>
<b>🎬 Type:</b> ${a.type||"Unknown"}<br>
<b>🏢 Studio:</b> ${escapeHtml(studios)}<br>
<b>📅 Status:</b> ${a.status||"Unknown"}

</div>

<a class="watch"
href="watch.html?anime=${encodeURIComponent(a.title)}&episode=1">
▶ Watch Episode 1
</a>

</div>

</div>
`;

status.style.display="none";
box.style.display="block";

}catch(error){

console.error(error);

status.className="error";
status.textContent=
"Couldn't load this anime. Try again.";

}

}

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
