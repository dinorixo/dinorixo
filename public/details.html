<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Details</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;padding:0 20px;gap:25px;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
header a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:auto;padding:20px}
.back{color:#ff3f91;text-decoration:none;display:inline-block;margin-bottom:15px}
h1{font-size:32px;margin:0 0 10px}
.episodes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.ep-btn{background:#14141e;border:1px solid rgba(255,255,255,.08);color:#fff;padding:15px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:.2s;}
.ep-btn:hover{background:linear-gradient(90deg,#ff3f91,#9b5cff);transform:translateY(-2px);}
.ep-num{font-weight:bold;font-size:16px;display:block;margin-bottom:4px;}
.ep-src{font-size:12px;color:#9292a3;}
:root{--bg:#07070b;--accent:#ff3f91;--accent2:#9b5cff;}
body{background:radial-gradient(circle at 15% 0%,rgba(255,63,145,.10),transparent 30%),radial-gradient(circle at 85% 10%,rgba(155,92,255,.10),transparent 28%),var(--bg) !important;}
.logo{background:linear-gradient(90deg,#ff3f91,#b56cff);-webkit-background-clip:text;background-clip:text;color:transparent !important;}
@media(max-width:700px){.episodes{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="logo">DIXORINO</div><a href="/">Home</a></header>
<main>
<a class="back" href="/">← Back Home</a>
<h1 id="anime-title">Anime Stream Player</h1>
<h2>Episodes</h2>
<div class="episodes" id="episode-grid"></div>
</main>
<script>
const params = new URLSearchParams(location.search);
const id = params.get("id") || "one-piece";

function generateFallbackEpisodes() {
  const grid = document.getElementById("episode-grid");
  grid.innerHTML = "";
  
  // Instantly generates 24 selectable stream containers without waiting for slow database lookups
  for (let i = 1; i <= 24; i++) {
    const link = document.createElement("a");
    link.className = "ep-btn";
    link.href = `watch.html?id=${id}&episode=${i}&anime=${encodeURIComponent("Anime Stream")}`;
    link.innerHTML = `
      <span class="ep-num">Episode ${i}</span>
      <span class="ep-src">Player Stream</span>
    `;
    grid.appendChild(link);
  }
}

// Fire the setup generation instantly
generateFallbackEpisodes();
</script>
</body>
</html>
