<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Anime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:Arial}
header{height:65px;background:#11131b;display:flex;align-items:center;padding:0 20px;gap:25px}.logo{font-size:25px;font-weight:bold;color:#ff3d91}a{color:white;text-decoration:none}
main{max-width:1000px;margin:auto;padding:25px 18px}.back{color:#ff3d91}
.box{margin-top:25px;background:#151821;padding:30px;border-radius:15px}
.poster{width:180px;height:250px;object-fit:cover;border-radius:10px;background:#222}
h1{font-size:35px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#292d38;padding:9px 14px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.ep{background:#191c26;padding:15px;text-align:center;border-radius:8px}.ep:hover{background:#ff3d91}
</style>
</head>
<body>
<header><div class="logo">DIXORINO</div><a href="/">Home</a></header>
<main>
<a class="back" href="/">← Back to DIXORINO</a>
<div class="box">
<img id="poster" class="poster">
<h1 id="title"></h1>
<p>A young warrior begins a dangerous journey filled with adventure and powerful enemies.</p>
<div class="tags"><span class="tag">Action</span><span class="tag">Adventure</span><span class="tag">HD</span></div>
</div>
<h2>Episodes</h2>
<div id="episodes" class="grid"></div>
</main>
<script>
const name=new URLSearchParams(location.search).get("anime")||"Demon Slayer";
title.textContent=name;
poster.src="https://placehold.co/300x420/171923/ff3d91?text="+encodeURIComponent(name);
let h="";
for(let i=1;i<=12;i++)h+=`<a class="ep" href="watch.html?anime=${encodeURIComponent(name)}&episode=${i}">Episode ${i}</a>`;
episodes.innerHTML=h;
</script>
</body>
</html>
