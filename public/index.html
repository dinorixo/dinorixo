<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
.search{flex:1;max-width:450px;background:#1b1e28;border:0;outline:0;color:white;padding:13px 18px;border-radius:25px;font-size:15px}
main{max-width:1200px;margin:auto;padding:25px}
h1,h2{margin-top:25px}
.status{color:#888;margin:10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.card{background:#171a23;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px)}
.poster{width:100%;height:260px;object-fit:cover;background:#191c25}
.card h3{font-size:16px;margin:10px 12px 5px}
.card p{color:#999;font-size:13px;margin:0 12px 15px}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.poster{height:220px}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}.poster{height:240px}main{padding:15px}}
</style>
</head>

<body>

<header>
<div class="logo">DIXORINO</div>
<input id="search" class="search" placeholder="Search anime...">
</header>

<main>

<h1>🔥 Popular Anime</h1>
<div id="status" class="status">Loading...</div>

<div id="grid" class="grid"></div>

</main>

<script>

const API="https://api.jikan.moe/v4";

const grid=document.getElementById("grid");
const status=document.getElementById("status");
const search=document.getElementById("search");

function card(a){

const title=a.title||"Unknown";
const image=a.images?.jpg?.large_image_url ||
             a.images?.jpg?.image_url || "";

return `
<div class="card"
onclick="openAnime(${a.mal_id})">

<img class="poster"
src="${image}"
alt="${title}"
loading="lazy">

<h3>${title}</h3>

<p>
${a.type||"Anime"} ·
${a.episodes||"?"} episodes
</p>

</div>
`;

}

async function loadPopular(){

status.textContent="Loading anime...";

try{

const res=await fetch(
API+"/top/anime?limit=20"
);

const data=await res.json();

grid.innerHTML=data.data.map(card).join("");

status.textContent=
data.data.length+" anime loaded";

}catch(error){

status.textContent=
"Couldn't load anime right now. Try again.";

console.error(error);

}

}

async function searchAnime(query){

if(!query.trim()){

loadPopular();
return;

}

status.textContent="Searching...";

try{

const res=await fetch(
API+"/anime?q="+
encodeURIComponent(query)+
"&limit=20"
);

const data=await res.json();

if(!data.data?.length){

grid.innerHTML="";
status.textContent="No anime found.";
return;

}

grid.innerHTML=
data.data.map(card).join("");

status.textContent=
data.data.length+" results";

}catch(error){

status.textContent=
"Search failed. Try again.";

}

}

function openAnime(id){

location.href=
"details.html?id="+id;

}

let timer;

search.addEventListener("input",()=>{

clearTimeout(timer);

timer=setTimeout(()=>{

searchAnime(search.value);

},500);

});

loadPopular();

</script>

</body>
</html>
