<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#08090d;
color:#fff;
font-family:Arial,sans-serif
}

header{
height:70px;
background:#10121a;
display:flex;
align-items:center;
gap:20px;
padding:0 20px;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:27px;
font-weight:900;
color:#ff3f91
}

.search{
flex:1;
max-width:500px;
background:#1b1e28;
border:0;
outline:0;
color:#fff;
padding:13px 18px;
border-radius:25px;
font-size:15px
}

main{
max-width:1200px;
margin:auto;
padding:20px
}

.hero{
padding:35px;
border-radius:18px;
margin-bottom:30px;
background:linear-gradient(135deg,#261225,#11131b)
}

.hero h1{
font-size:38px;
margin:10px 0
}

.hero p{
color:#aaa
}

section{
margin-top:30px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:14px
}

.card{
background:#171a23;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s;
position:relative
}

.card:hover{
transform:translateY(-4px)
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
background:#1b1e27
}

.card h3{
font-size:14px;
margin:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.card p{
font-size:12px;
color:#888;
margin:0 10px 12px
}

.heart{
position:absolute;
right:7px;
top:7px;
border:0;
border-radius:50%;
width:35px;
height:35px;
background:#090a0f;
color:white;
font-size:19px
}

.heart.on{
color:#ff3f91
}

.loading{
color:#888;
padding:20px 0
}

@media(max-width:1000px){
.grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:650px){
.grid{grid-template-columns:repeat(3,1fr)}
.poster{height:210px}
.hero h1{font-size:28px}
}

@media(max-width:450px){
.grid{grid-template-columns:repeat(2,1fr)}
.poster{height:240px}
header{padding:0 12px}
.logo{font-size:22px}
.search{max-width:none}
}

/* ================================
   DIXORINO 2.0 — MODERN UI
   ================================ */

:root{
  --bg:#07070b;
  --panel:#101018;
  --panel2:#151520;
  --accent:#ff3f91;
  --accent2:#9b5cff;
  --text:#f7f7fb;
  --muted:#9292a3;
  --border:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
}

body{
  background:
    radial-gradient(circle at 15% 0%,rgba(255,63,145,.10),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(155,92,255,.10),transparent 28%),
    var(--bg) !important;
  color:var(--text) !important;
}

/* HEADER */

header{
  height:72px !important;
  background:rgba(10,10,16,.82) !important;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:0 28px !important;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px !important;
  font-weight:950 !important;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#ff3f91,#b56cff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent !important;
}

header a{
  color:#d8d8e2 !important;
  font-weight:600;
  transition:.2s;
}

header a:hover{
  color:#fff !important;
}

/* MAIN */

main{
  max-width:1250px !important;
  padding:30px 22px !important;
}

/* SEARCH */

input[type="search"],
input[type="text"]{
  background:rgba(255,255,255,.055) !important;
  border:1px solid var(--border) !important;
  color:#fff !important;
  border-radius:14px !important;
  padding:14px 18px !important;
  outline:none;
  transition:.25s;
}

input[type="search"]:focus,
input[type="text"]:focus{
  border-color:rgba(255,63,145,.6) !important;
  box-shadow:0 0 0 4px rgba(255,63,145,.08);
}

/* CARDS */

.card{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.075),
    rgba(255,255,255,.025)
  ) !important;
  border:1px solid var(--border);
  border-radius:16px !important;
  overflow:hidden;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
  position:relative;
}

.card:hover{
  transform:translateY(-7px);
  border-color:rgba(255,63,145,.35);
  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    0 0 30px rgba(255,63,145,.08);
}

.card img{
  transition:transform .4s ease;
}

.card:hover img{
  transform:scale(1.045);
}

/* BUTTONS */

button,
.control,
.load-more{
  border:1px solid rgba(255,255,255,.08) !important;
  border-radius:11px !important;
  transition:.2s ease !important;
}

button:hover,
.control:hover,
.load-more:hover{
  background:linear-gradient(90deg,var(--accent),var(--accent2)) !important;
  color:#fff !important;
  transform:translateY(-1px);
}

/* TAGS */

.tag{
  background:rgba(255,63,145,.10) !important;
  border:1px solid rgba(255,63,145,.18);
  color:#ff8cba !important;
  border-radius:999px !important;
  padding:5px 10px !important;
}

/* DETAILS HERO */

.hero{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    ) !important;
  border:1px solid var(--border);
  border-radius:24px !important;
  padding:25px !important;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.poster{
  border-radius:17px !important;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.content h1{
  font-size:clamp(30px,5vw,54px) !important;
  letter-spacing:-1.5px;
}

.description{
  color:#b6b6c3 !important;
  line-height:1.75 !important;
}

/* INFO */

.info{
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px 17px;
  line-height:1.9;
  color:#d4d4df;
}

/* FAVORITE */

.favorite{
  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  ) !important;
  color:#fff !important;
  font-weight:700;
  border:0 !important;
  padding:13px 22px !important;
}

/* TRAILER */

.trailer{
  margin-top:25px;
  border-radius:18px;
  overflow:hidden;
}

/* EPISODES */

.episodes{
  gap:10px !important;
}

.ep{
  background:#14141e !important;
  border:1px solid var(--border) !important;
  color:#ddd !important;
}

.ep.active,
.ep:hover{
  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  ) !important;
}

/* WATCH PLAYER */

.player-wrap{
  border:1px solid var(--border);
  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 50px rgba(255,63,145,.05);
}

video{
  border-radius:14px;
}

.player-status{
  background:rgba(5,5,10,.82) !important;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
}

/* WATCH NOTICE */

.notice{
  background:rgba(255,255,255,.035) !important;
  border:1px solid var(--border);
  color:#9292a3 !important;
}

/* LOADING */

.loading{
  color:#aaa !important;
}

/* MOBILE */

@media(max-width:700px){

  header{
    height:62px !important;
    padding:0 15px !important;
  }

  main{
    padding:20px 14px !important;
  }

  .hero{
    padding:15px !important;
    border-radius:18px !important;
  }

  .poster{
    border-radius:13px !important;
  }

  .card{
    border-radius:13px !important;
  }

}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:#07070b;
}

::-webkit-scrollbar-thumb{
  background:#292936;
  border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
  background:#ff3f91;
}

</style>
</head>

<body>

<header>

<div class="logo">DIXORINO</div>

<input
id="search"
class="search"
placeholder="Search anime..."
autocomplete="off">

</header>

<main>

<div class="hero">

<div style="color:#ff3f91;font-weight:bold">
WELCOME TO DIXORINO
</div>

<h1>Watch. Discover. Enjoy.</h1>

<p>
Discover thousands of anime and find your next favorite.
</p>

</div>

<section id="continueSection" style="display:none">

<div class="section-title">
<h2>🕒 Continue Watching</h2>
</div>

<div id="continueGrid" class="grid"></div>

</section>

<section id="favoritesSection" style="display:none">

<div class="section-title">
<h2>❤️ My Favorites</h2>
</div>

<div id="favoritesGrid" class="grid"></div>

</section>

<section>

<div class="section-title">
<h2>🔥 Popular Anime</h2>
</div>

<div id="popular" class="grid">
<div class="loading">Loading...</div>
</div>


</section>

<section>

<div class="section-title">
<h2>🆕 Latest Anime</h2>
</div>

<div id="latest" class="grid">
<div class="loading">Loading...</div>
</div>


</section>

<section>
<h2>🎭 Browse Genres</h2>
<div id="genres" style="display:flex;flex-wrap:wrap;gap:10px"></div>
</section>

<section id="searchSection" style="display:none">

<h2>🔎 Search Results</h2>

<div id="results" class="grid"></div>

</section>

</main>

<script>

const API="https://api.jikan.moe/v4";

let favorites=
JSON.parse(
localStorage.getItem("dixorinoFavorites")||"[]"
);

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function createCard(a){

const id=a.mal_id;

const title=
a.title||"Unknown";

const image=
a.images?.jpg?.large_image_url||
a.images?.jpg?.image_url||
"";

const fav=
favorites.includes(id);

return `

<div class="card"
data-anilist-id="${a.anilist_id||""}"
onclick="openAnime(${id})">

<button
class="heart ${fav?"on":""}"
onclick="toggleFavorite(event,${id})">

${fav?"♥":"♡"}

</button>

<img
class="poster"
src="${image}"
alt="${escapeHTML(title)}"
loading="lazy">

<h3>${escapeHTML(title)}</h3>

<p>
⭐ ${a.score||"N/A"}
 ·
 ${a.episodes||"?"} eps
</p>

</div>

`;

}

function openAnime(id){

const card=document.querySelector(
'.card[onclick="openAnime('+id+')"]'
);

const anilistId=card?.dataset?.anilistId||"";

if(anilistId){

location.href=
"details.html?anilist="+
encodeURIComponent(anilistId);

return;

}

if(id){

location.href=
"details.html?id="+
encodeURIComponent(id);

}

}

function toggleFavorite(event,id){

event.stopPropagation();

if(favorites.includes(id)){

favorites=
favorites.filter(x=>x!==id);

}else{

favorites.push(id);

}

localStorage.setItem(
"dixorinoFavorites",
JSON.stringify(favorites)
);

loadFavorites();

}

async function getAnime(url){

const response=
await fetch(url);

const data=
await response.json();

return data.data||[];

}

async function loadPopular(){

try{

const data=
await getAnime(
API+"/top/anime?limit=12"
);

document.getElementById("popular").innerHTML=
data.map(createCard).join("");

}catch(e){

document.getElementById("popular").innerHTML=
"<div class='loading'>Unable to load anime.</div>";

}

}

async function loadLatest(){

try{

const data=
await getAnime(
API+"/anime?order_by=mal_id&sort=desc&limit=12"
);

document.getElementById("latest").innerHTML=
data.map(createCard).join("");

}catch(e){

document.getElementById("latest").innerHTML=
"<div class='loading'>Unable to load anime.</div>";

}

}


let searchPage = 1;
let currentSearch = "";
let searchLoading = false;
let searchHasNext = false;

async function searchAnime(query, append=false){

  query=query.trim();

  if(!query){
    document.getElementById("searchSection").style.display="none";
    currentSearch="";
    searchPage=1;
    return;
  }

  if(searchLoading)return;

  if(!append){
    currentSearch=query;
    searchPage=1;
    document.getElementById("searchSection").style.display="block";
    document.getElementById("results").innerHTML=
      "<div class='loading'>Searching...</div>";
  }

  searchLoading=true;

  try{

    const graphql = `
      query ($search: String, $page: Int) {
        Page(page: $page, perPage: 24) {
          pageInfo {
            hasNextPage
          }
          media(
            search: $search,
            type: ANIME,
            sort: SEARCH_MATCH
          ) {
            id
            idMal
            title {
              romaji
              english
              native
            }
            coverImage {
              large
              medium
            }
            averageScore
            episodes
            genres
            status
          }
        }
      }
    `;

    const response = await fetch(
      "https://graphql.anilist.co",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          query: graphql,
          variables: {
            search: currentSearch,
            page: searchPage
          }
        })
      }
    );

    if(!response.ok){
      throw new Error(
        "AniList search failed: "+response.status
      );
    }

    const json = await response.json();

    if(json.errors){
      throw new Error(json.errors[0]?.message || "AniList error");
    }

    const page=json.data?.Page;

    const data=page?.media||[];

    searchHasNext=!!page?.pageInfo?.hasNextPage;

    const converted=data.map(a => ({
      mal_id: a.idMal || null,
      anilist_id: a.id,
      title:
        a.title?.english ||
        a.title?.romaji ||
        a.title?.native ||
        "Unknown",
      images:{
        jpg:{
          large_image_url:
            a.coverImage?.large ||
            a.coverImage?.medium ||
            ""
        }
      },
      score:
        a.averageScore ?
        a.averageScore / 10 :
        null,
      episodes:a.episodes,
      genres:(a.genres||[]).map(name => ({
        mal_id:0,
        name
      }))
    }));

    const results=document.getElementById("results");

    if(!append){
      results.innerHTML="";
    }

    if(!converted.length && !append){
      results.innerHTML=
        "<div class='loading'>No anime found.</div>";
      return;
    }

    const oldLoadMore=document.getElementById(
      "searchLoadMore"
    );

    if(oldLoadMore){
      oldLoadMore.remove();
    }

    results.insertAdjacentHTML(
      "beforeend",
      converted.map(createCard).join("")
    );

    if(searchHasNext){

      const button=document.createElement("button");

      button.id="searchLoadMore";
      button.className="load-more";
      button.textContent="Load More Anime";

      button.onclick=async function(){

        button.disabled=true;
        button.textContent="Loading...";

        searchPage++;

        await searchAnime(currentSearch,true);

      };

      results.appendChild(button);

    }

  }catch(error){

    console.error(error);

    document.getElementById("results").insertAdjacentHTML(
      "beforeend",
      "<div class='loading'>Search is temporarily unavailable. Please try again.</div>"
    );

  }finally{

    searchLoading=false;

  }

}

function loadFavorites(){

const section=
document.getElementById("favoritesSection");

const grid=
document.getElementById("favoritesGrid");

if(!favorites.length){

section.style.display="none";
return;

}

section.style.display="block";

grid.innerHTML=
"<div class='loading'>Loading favorites...</div>";

Promise.all(

favorites.slice(0,12).map(async id=>{

try{

const response=
await fetch(API+"/anime/"+id);

const result=
await response.json();

return result.data;

}catch(e){

return null;

}

})

).then(items=>{

const valid=
items.filter(Boolean);

grid.innerHTML=
valid.map(createCard).join("");

});

}

function loadContinue(){

const saved=
JSON.parse(
localStorage.getItem("dixorinoLastWatched")||"null"
);

if(!saved)return;

document.getElementById("continueSection")
.style.display="block";

document.getElementById("continueGrid").innerHTML=`

<div class="card"
onclick="location.href='watch.html?anime=${encodeURIComponent(saved.anime)}&episode=${saved.episode}'">

<div class="poster"
style="display:flex;align-items:center;justify-content:center;font-size:40px">
▶
</div>

<h3>${escapeHTML(saved.anime)}</h3>

<p>Episode ${saved.episode}</p>

</div>

`;

}

const genreList=[["Action",1],["Adventure",2],["Comedy",4],["Fantasy",10],["Romance",22],["Sports",30],["Horror",14],["Mystery",7],["Sci-Fi",24],["Supernatural",37]];
document.getElementById("genres").innerHTML=genreList.map(g=>`<button style="background:#191c26;color:white;border:0;padding:11px 16px;border-radius:20px" onclick="openGenre(${g[1]},'${g[0]}')">${g[0]}</button>`).join("");
async function openGenre(id,name){
  const section=document.getElementById("searchSection");
  const results=document.getElementById("results");

  section.style.display="block";
  results.innerHTML="<div class='loading'>Loading "+name+" anime...</div>";

  try{
    const response=await fetch(API+"/top/anime?limit=25");

    if(!response.ok){
      throw new Error("Jikan API error: "+response.status);
    }

    const json=await response.json();

    const data=(json.data||[]).filter(anime =>
      (anime.genres||[]).some(g =>
        Number(g.mal_id)===Number(id)
      )
    );

    results.innerHTML=
      "<h2>"+name+" Anime</h2>"+
      (data.length
        ? data.map(createCard).join("")
        : "<div class='loading'>No "+name+" anime found in the current list. Try again later.</div>");

    window.scrollTo({
      top:section.offsetTop-80,
      behavior:"smooth"
    });

  }catch(error){
    console.error(error);

    results.innerHTML=
      "<div class='loading'>"+name+
      " anime is temporarily unavailable. Please try again in a moment.</div>";
  }
}

let timer;

document.getElementById("search")
.addEventListener("input",function(){

clearTimeout(timer);

timer=setTimeout(
()=>searchAnime(this.value),
500
);

});

loadPopular();
loadLatest();
loadFavorites();
loadContinue();

</script>

</body>
</html>
