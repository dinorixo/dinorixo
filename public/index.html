<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#08090d;
color:#fff;
font-family:Arial,sans-serif
}

header{
height:70px;
background:#10121a;
display:flex;
align-items:center;
gap:20px;
padding:0 20px;
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:27px;
font-weight:900;
color:#ff3f91
}

.search{
flex:1;
max-width:500px;
background:#1b1e28;
border:0;
outline:0;
color:#fff;
padding:13px 18px;
border-radius:25px;
font-size:15px
}

main{
max-width:1200px;
margin:auto;
padding:20px
}

.hero{
padding:35px;
border-radius:18px;
margin-bottom:30px;
background:linear-gradient(135deg,#261225,#11131b)
}

.hero h1{
font-size:38px;
margin:10px 0
}

.hero p{
color:#aaa
}

section{
margin-top:30px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center
}

.grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:14px
}

.card{
background:#171a23;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s;
position:relative
}

.card:hover{
transform:translateY(-4px)
}

.poster{
width:100%;
height:250px;
object-fit:cover;
display:block;
background:#1b1e27
}

.card h3{
font-size:14px;
margin:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.card p{
font-size:12px;
color:#888;
margin:0 10px 12px
}

.heart{
position:absolute;
right:7px;
top:7px;
border:0;
border-radius:50%;
width:35px;
height:35px;
background:#090a0f;
color:white;
font-size:19px
}

.heart.on{
color:#ff3f91
}

.loading{
color:#888;
padding:20px 0
}

@media(max-width:1000px){
.grid{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:650px){
.grid{grid-template-columns:repeat(3,1fr)}
.poster{height:210px}
.hero h1{font-size:28px}
}

@media(max-width:450px){
.grid{grid-template-columns:repeat(2,1fr)}
.poster{height:240px}
header{padding:0 12px}
.logo{font-size:22px}
.search{max-width:none}
}
</style>
</head>

<body>

<header>

<div class="logo">DIXORINO</div>

<input
id="search"
class="search"
placeholder="Search anime..."
autocomplete="off">

</header>

<main>

<div class="hero">

<div style="color:#ff3f91;font-weight:bold">
WELCOME TO DIXORINO
</div>

<h1>Watch. Discover. Enjoy.</h1>

<p>
Discover thousands of anime and find your next favorite.
</p>

</div>

<section id="continueSection" style="display:none">

<div class="section-title">
<h2>🕒 Continue Watching</h2>
</div>

<div id="continueGrid" class="grid"></div>

</section>

<section id="favoritesSection" style="display:none">

<div class="section-title">
<h2>❤️ My Favorites</h2>
</div>

<div id="favoritesGrid" class="grid"></div>

</section>

<section>

<div class="section-title">
<h2>🔥 Popular Anime</h2>
</div>

<div id="popular" class="grid">
<div class="loading">Loading...</div>
</div>

</section>

<section>

<div class="section-title">
<h2>🆕 Latest Anime</h2>
</div>

<div id="latest" class="grid">
<div class="loading">Loading...</div>
</div>

</section>

<section>
<h2>🎭 Browse Genres</h2>
<div id="genres" style="display:flex;flex-wrap:wrap;gap:10px"></div>
</section>

<section id="searchSection" style="display:none">

<h2>🔎 Search Results</h2>

<div id="results" class="grid"></div>

</section>

</main>

<script>

const API="https://api.jikan.moe/v4";

let favorites=
JSON.parse(
localStorage.getItem("dixorinoFavorites")||"[]"
);

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function createCard(a){

const id=a.mal_id;

const title=
a.title||"Unknown";

const image=
a.images?.jpg?.large_image_url||
a.images?.jpg?.image_url||
"";

const fav=
favorites.includes(id);

return `

<div class="card"
onclick="openAnime(${id})">

<button
class="heart ${fav?"on":""}"
onclick="toggleFavorite(event,${id})">

${fav?"♥":"♡"}

</button>

<img
class="poster"
src="${image}"
alt="${escapeHTML(title)}"
loading="lazy">

<h3>${escapeHTML(title)}</h3>

<p>
⭐ ${a.score||"N/A"}
 ·
 ${a.episodes||"?"} eps
</p>

</div>

`;

}

function openAnime(id){

location.href=
"details.html?id="+id;

}

function toggleFavorite(event,id){

event.stopPropagation();

if(favorites.includes(id)){

favorites=
favorites.filter(x=>x!==id);

}else{

favorites.push(id);

}

localStorage.setItem(
"dixorinoFavorites",
JSON.stringify(favorites)
);

loadFavorites();

}

async function getAnime(url){

const response=
await fetch(url);

const data=
await response.json();

return data.data||[];

}

async function loadPopular(){

try{

const data=
await getAnime(
API+"/top/anime?limit=12"
);

document.getElementById("popular").innerHTML=
data.map(createCard).join("");

}catch(e){

document.getElementById("popular").innerHTML=
"<div class='loading'>Unable to load anime.</div>";

}

}

async function loadLatest(){

try{

const data=
await getAnime(
API+"/anime?order_by=mal_id&sort=desc&limit=12"
);

document.getElementById("latest").innerHTML=
data.map(createCard).join("");

}catch(e){

document.getElementById("latest").innerHTML=
"<div class='loading'>Unable to load anime.</div>";

}

}

async function searchAnime(query){

query=query.trim();

const section=document.getElementById("searchSection");
const results=document.getElementById("results");

if(!query){
section.style.display="none";
return;
}

section.style.display="block";

results.innerHTML=
"<div class='loading'>🔎 Searching...</div>";

try{

if(!window.animeCache){

const response=
await fetch(API+"/top/anime?limit=25");

if(!response.ok)
throw new Error("API error");

const json=await response.json();

window.animeCache=json.data||[];

}

const q=query.toLowerCase();

const matches=window.animeCache.filter(a=>
(a.title||"").toLowerCase().includes(q) ||
(a.title_english||"").toLowerCase().includes(q) ||
(a.title_japanese||"").toLowerCase().includes(q)
);

results.innerHTML=
"<h2>🔎 Search Results</h2>"+
(
matches.length
?matches.map(createCard).join("")
:"<div class='loading'>No matching anime found in the loaded list.</div>"
);

window.scrollTo({
top:section.offsetTop-80,
behavior:"smooth"
});

}catch(e){

console.error(e);

results.innerHTML=
"<div class='loading'>Unable to search right now.</div>";

}

}

function loadFavorites(){

const section=
document.getElementById("favoritesSection");

const grid=
document.getElementById("favoritesGrid");

if(!favorites.length){

section.style.display="none";
return;

}

section.style.display="block";

grid.innerHTML=
"<div class='loading'>Loading favorites...</div>";

Promise.all(

favorites.slice(0,12).map(async id=>{

try{

const response=
await fetch(API+"/anime/"+id);

const result=
await response.json();

return result.data;

}catch(e){

return null;

}

})

).then(items=>{

const valid=
items.filter(Boolean);

grid.innerHTML=
valid.map(createCard).join("");

});

}

function loadContinue(){

const saved=
JSON.parse(
localStorage.getItem("dixorinoLastWatched")||"null"
);

if(!saved)return;

document.getElementById("continueSection")
.style.display="block";

document.getElementById("continueGrid").innerHTML=`

<div class="card"
onclick="location.href='watch.html?anime=${encodeURIComponent(saved.anime)}&episode=${saved.episode}'">

<div class="poster"
style="display:flex;align-items:center;justify-content:center;font-size:40px">
▶
</div>

<h3>${escapeHTML(saved.anime)}</h3>

<p>Episode ${saved.episode}</p>

</div>

`;

}

const genreList=[["Action",1],["Adventure",2],["Comedy",4],["Fantasy",10],["Romance",22],["Sports",30],["Horror",14],["Mystery",7],["Sci-Fi",24],["Supernatural",37]];
document.getElementById("genres").innerHTML=genreList.map(g=>`<button style="background:#191c26;color:white;border:0;padding:11px 16px;border-radius:20px" onclick="openGenre(${g[1]},'${g[0]}')">${g[0]}</button>`).join("");
async function openGenre(id,name){
  const section=document.getElementById("searchSection");
  const results=document.getElementById("results");

  section.style.display="block";
  results.innerHTML="<div class='loading'>Loading "+name+" anime...</div>";

  try{
    const response=await fetch(API+"/top/anime?limit=25");

    if(!response.ok){
      throw new Error("Jikan API error: "+response.status);
    }

    const json=await response.json();

    const data=(json.data||[]).filter(anime =>
      (anime.genres||[]).some(g =>
        Number(g.mal_id)===Number(id)
      )
    );

    results.innerHTML=
      "<h2>"+name+" Anime</h2>"+
      (data.length
        ? data.map(createCard).join("")
        : "<div class='loading'>No "+name+" anime found in the current list. Try again later.</div>");

    window.scrollTo({
      top:section.offsetTop-80,
      behavior:"smooth"
    });

  }catch(error){
    console.error(error);

    results.innerHTML=
      "<div class='loading'>"+name+
      " anime is temporarily unavailable. Please try again in a moment.</div>";
  }
}

let timer;

document.getElementById("search")
.addEventListener("input",function(){

clearTimeout(timer);

timer=setTimeout(
()=>searchAnime(this.value),
500
);

});

loadPopular();
loadLatest();
loadFavorites();
loadContinue();

</script>

</body>
</html>
