<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIXORINO - Watch</title>
<script src="https://jsdelivr.net"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif}
header{height:70px;background:#10121a;display:flex;align-items:center;padding:0 20px;gap:25px;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:900;color:#ff3f91}
header a{color:#fff;text-decoration:none}
main{max-width:1100px;margin:auto;padding:20px}
.back{color:#ff3f91;text-decoration:none;display:inline-block;margin-bottom:15px}
.player-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.35)}
video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.player-status{position:absolute;left:15px;bottom:15px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:7px;font-size:13px;color:#bbb;pointer-events:none}
h1{font-size:27px;margin:20px 0 5px}
.muted{color:#999}
.controls{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.control{background:#191c26;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none;border:0;cursor:pointer;font-size:14px}
.control:hover{background:#ff3f91}
.control.disabled{opacity:.4;pointer-events:none}
.progress{height:4px;background:#242733;border-radius:5px;margin-top:12px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:#ff3f91;transition:width .2s}
.episodes{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}
.ep{background:#14141e !important;border:1px solid rgba(255,255,255,.08) !important;color:#ddd !important;padding:13px 7px;border-radius:7px;cursor:pointer}
.ep:hover,.ep.active{background:linear-gradient(90deg,#ff3f91,#9b5cff) !important;}
.player-wrap{border:1px solid rgba(255,255,255,.08);box-shadow:0 25px 70px rgba(0,0,0,.55),0 0 50px rgba(255,63,145,.05);}
video{border-radius:14px;}
.player-status{background:rgba(5,5,10,.82) !important;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);}
@media(max-width:700px){.episodes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="logo">DIXORINO</div><a href="/">Home</a></header>
<main>
<a class="back" id="back">← Back to Anime</a>
<div class="player-wrap">
<video id="player" controls playsinline preload="metadata"></video>
<div class="player-status" id="playerStatus">Ready</div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<h1 id="title">Loading...</h1>
<div class="muted" id="episode">Episode 1</div>
<div class="controls"><a class="control" id="previous">← Previous</a><a class="control" id="next">Next →</a></div>
<h2>Episodes</h2>
<div class="episodes" id="episodes"></div>
</main>
<script>
const params = new URLSearchParams(location.search);
const anime = params.get("anime") || "Anime Stream";
let id = params.get("id") || "";
const currentEpisodeNum = Number(params.get("episode")) || 1;
const player = document.getElementById("player");
const status = document.getElementById("playerStatus");
const progressBar = document.getElementById("progressBar");

document.title = "DIXORINO - " + anime;
document.getElementById("title").textContent = anime;
document.getElementById("episode").textContent = "Episode " + currentEpisodeNum;
document.getElementById("back").href = id ? "details.html?id=" + encodeURIComponent(id) : "/";

async function loadVideoSource() {
  if (!id) { status.textContent = "Error: Missing ID"; return; }
  status.textContent = "Connecting to network...";
  
  try {
    // Step 1: Convert current tracking ID into real query paths if numerical elements clash
    let cleanId = id;
    if (!isNaN(cleanId)) {
      const sRes = await fetch(`/api/search?q=${encodeURIComponent(cleanId)}`);
      const sData = await sRes.json();
      if (sData.data && sData.data.length > 0) {
        cleanId = sData.data[0].mal_id || sData.data[0].id;
      }
    }

    // Step 2: Fetch Episode Streams Map directly from our setup routes
    const epRes = await fetch(`/api/episodes?id=${cleanId}`);
    const epData = await epRes.json();
    const episodeList = epData.episodes || [];
    
    // Draw 24 working stream links automatically if the index lookup returns empty
    const visualList = episodeList.length > 0 ? episodeList : Array.from({length: 24}, (_, i) => ({ number: i + 1, id: `${cleanId}-episode-${i + 1}` }));

    const box = document.getElementById("episodes");
    box.innerHTML = "";
    visualList.forEach((ep) => {
      const button = document.createElement("button");
      button.className = "ep" + (ep.number === currentEpisodeNum ? " active" : "");
      button.textContent = "Ep " + ep.number;
      button.onclick = () => { location.href = `watch.html?anime=${encodeURIComponent(anime)}&episode=${ep.number}&id=${encodeURIComponent(id)}`; };
      box.appendChild(button);
    });

    const activeEpItem = visualList.find(e => e.number === currentEpisodeNum) || visualList[currentEpisodeNum - 1];
    
    const prevBtn = document.getElementById("previous");
    const nextBtn = document.getElementById("next");
    if (currentEpisodeNum > 1) { prevBtn.href = `watch.html?anime=${encodeURIComponent(anime)}&episode=${currentEpisodeNum - 1}&id=${encodeURIComponent(id)}`; } else { prevBtn.classList.add("disabled"); }
    if (currentEpisodeNum < visualList.length) { nextBtn.href = `watch.html?anime=${encodeURIComponent(anime)}&episode=${currentEpisodeNum + 1}&id=${encodeURIComponent(id)}`; } else { nextBtn.classList.add("disabled"); }

    status.textContent = "Extracting stream URLs...";
    
    // Step 3: Hit the backend route to extract the direct stream playlist file
    const streamRes = await fetch(`/api/stream?animeId=${cleanId}&episodeId=${encodeURIComponent(activeEpItem.id)}&number=${currentEpisodeNum}`);
    const streamData = await streamRes.json();
    
    const targetSource = streamData.sources?.find(s => s.quality === "default" || s.quality === "1080p") || streamData.sources?.[0];

    if (targetSource && targetSource.url) {
      status.textContent = "Playing Stream";
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(targetSource.url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { player.play().catch(e => console.log(e)); });
      } else {
        player.src = targetSource.url;
        player.play().catch(e => console.log(e));
      }
    } else { 
      status.textContent = "Trying secondary fallback streaming servers...";
      // Ultimate absolute direct stream wrapper fallback link if API returns empty
      const fallbackUrl = `https://anify.tv{cleanId}/${activeEpItem.id}/${currentEpisodeNum}/gogoanime`;
      const fRes = await fetch(fallbackUrl);
      const fData = await fRes.json();
      const fSrc = fData.sources?.find(s => s.quality === "default" || s.quality === "1080p") || fData.sources?.[0];
      
      if (fSrc && fSrc.url) {
        status.textContent = "Playing Fallback Track";
        if (Hls.isSupported()) {
          const hls = new Hls(); hls.loadSource(fSrc.url); hls.attachMedia(player);
          hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
        } else { player.src = fSrc.url; player.play(); }
      } else {
        status.textContent = "Stream source restricted. Please select another trending title!";
      }
    }
  } catch(e) { 
    console.error(e); 
    status.textContent = "Streaming server connection offline."; 
  }
}

loadVideoSource();
player.addEventListener("timeupdate", () => {
  if (!player.duration) return;
  const percent = (player.currentTime / player.duration) * 100;
  progressBar.style.width = percent + "%";
});
</script>
</body>
</html>
